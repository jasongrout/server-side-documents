# Redocly CLI configuration, used by `pixi run lint`.
# Matches the JupyterHub REST API lint configuration:
# https://github.com/jupyterhub/jupyterhub/blob/main/redocly.yaml
# See https://redocly.com/docs/cli/configuration

extends:
  - recommended-strict

apis:
  execute:
    root: ./ssd-execute-openapi.yaml

# custom rules
# https://redocly.com/docs/cli/rules/configurable-rules/
rules:
  # Every operation must have tags, and each must be declared in the
  # top-level `tags` list.
  operation-tag-defined: error

  rule/required-items-in-array-schemas:
    subject:
      type: Schema
    assertions:
      required:
        - items
    where:
      - subject:
          type: Schema
          property: type
        assertions:
          const: array
          defined: true
    message: The 'items' field is required for schemas of array type.

  rule/require-schema-type:
    subject:
      type: Schema
      property: type
    assertions:
      defined: true
    message: schema missing type
    where:
      # don't require type on schemas that reference other schemas, which already must specify type
      - subject:
          type: Schema
          property: allOf
        assertions:
          defined: false

  rule/require-parameter-schema:
    subject:
      type: Parameter
      property: schema
    assertions:
      defined: true
    message: Parameter missing schema
