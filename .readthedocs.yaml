# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"
  jobs:
    # The Sphinx build links to a standalone Redoc page for the OpenAPI spec
    # (see docs/api.md); generate it into the HTML output after Sphinx runs.
    post_build:
      - REDOCLY_TELEMETRY=off REDOCLY_SUPPRESS_NOTIFICATIONS=true npx --yes @redocly/cli@2.72.1 build-docs ssd-execute-openapi.yaml -o "$READTHEDOCS_OUTPUT/html/execute-api.html"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: requirements.txt
